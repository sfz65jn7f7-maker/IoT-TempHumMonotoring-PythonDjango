{% extends 'DHT/base.html' %}
{% load static %}
{% block title %}Graphique de la température{% endblock %}

{% block content %}
  <div class="topbar">
    <a class="btn secondary" href="{% url 'dashboard' %}">← Retour</a>
    <button class="btn" id="csv">Télécharger en CSV</button>
  </div>
  <h1>Graphique de la température</h1>
  <div class="box"><canvas id="chart"></canvas></div>
  <div id="status">En attente des données...</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'DHT/chart.umd.js' %}"></script>
<script>
  let rows = [];
  const seuil = (label) => ({ label: label, data: [], borderColor: '#999', borderDash: [6, 4], pointRadius: 0, fill: false });
  const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Température (°C)', data: [], borderColor: '#e4572e', backgroundColor: '#e4572e22', fill: true, tension: 0.3 },
        seuil('Seuil max'), seuil('Seuil min')
      ]
    },
    options: {
      animation: false,
      scales: {
        y: { min: 0, max: 50, title: { display: true, text: '°C' } },
        x: { title: { display: true, text: 'Heure' } }
      }
    }
  });

  async function refresh() {
    try {
      rows = await chargerMesures();
      if (rows.length === 0) {
        document.getElementById('status').textContent = 'Aucune mesure reçue pour le moment';
        return;
      }
      const labels = rows.map(r => new Date(r.date).toLocaleTimeString());
      chart.data.labels = labels;
      chart.data.datasets[0].data = rows.map(r => r.temp);
      chart.data.datasets[1].data = labels.map(() => SEUIL_MAX);
      chart.data.datasets[2].data = labels.map(() => SEUIL_MIN);
      chart.update();
      document.getElementById('status').textContent =
        'Dernière mesure : ' + new Date(rows[rows.length - 1].date).toLocaleString();
    } catch (e) {
      document.getElementById('status').textContent = 'Erreur de connexion au serveur';
    }
  }

  document.getElementById('csv').addEventListener('click', () => {
    if (rows.length === 0) { alert('Aucune mesure à télécharger.'); return; }
    telechargerCSV('temperature.csv', ['Date et heure', 'Température (°C)'],
                   rows.map(r => [formatDate(r.date), r.temp]));
  });

  refresh();
  setInterval(refresh, 5000);
</script>
{% endblock %}
