{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Température et humidité</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 20px; color: #222; }
    h1 { text-align: center; }
    .cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 16px 36px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    .card .value { font-size: 44px; font-weight: bold; }
    .temp .value { color: #e4572e; }
    .hum .value { color: #1b7fd0; }
    .inc .value { color: #8e24aa; }
    .box { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    .box h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { border: 1px solid #ccd; padding: 6px 10px; }
    th { background: #e8ecf3; }
    tr.alerte td { background: #fdeaea; }
    #status { text-align: center; margin-top: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Température et humidité en temps réel</h1>

  <div class="cards">
    <div class="card temp"><div>Température</div><div class="value" id="temp">--</div></div>
    <div class="card hum"><div>Humidité</div><div class="value" id="hum">--</div></div>
    <div class="card inc"><div>Incidents détectés</div><div class="value" id="nbInc">0</div></div>
  </div>

  <div class="charts">
    <div class="box"><h2>Graphique de la température</h2><canvas id="chartTemp"></canvas></div>
    <div class="box"><h2>Graphique de l'humidité</h2><canvas id="chartHum"></canvas></div>
  </div>

  <div class="box">
    <h2>Tableau de suivi des incidents</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Temps</th><th>Température (°C)</th><th>Incident</th><th>Compteur</th><th>Op1</th><th>Op2</th><th>Op3</th></tr>
        </thead>
        <tbody id="corps"></tbody>
      </table>
    </div>
  </div>

  <div id="status">En attente des données...</div>

  <script src="{% static 'DHT/chart.umd.js' %}"></script>
  <script>
    // ---- Réglages (à adapter) ----
    const SEUIL_MAX = 25;          // incident si température > SEUIL_MAX
    const SEUIL_MIN = 15;          // ou si température < SEUIL_MIN
    const NIVEAUX = [1, 4, 7];     // compteur à atteindre pour Op1, Op2, Op3
    const MAX_LIGNES = 15;         // nombre de lignes affichées dans le tableau
    // Pour reproduire l'exemple du prof : SEUIL_MAX = 8 et SEUIL_MIN = 2

    function analyser(rows) {
      let compteur = 0;
      return rows.map(r => {
        const incident = (r.temp > SEUIL_MAX || r.temp < SEUIL_MIN) ? 1 : 0;
        compteur = incident ? compteur + 1 : 0;
        return {
          date: r.date, temp: r.temp, incident: incident, compteur: compteur,
          op1: compteur >= NIVEAUX[0] ? 1 : 0,
          op2: compteur >= NIVEAUX[1] ? 1 : 0,
          op3: compteur >= NIVEAUX[2] ? 1 : 0
        };
      });
    }

    function creerGraphique(idCanvas, datasets, unite, min, max) {
      if (typeof Chart === 'undefined') return null;
      return new Chart(document.getElementById(idCanvas), {
        type: 'line',
        data: { labels: [], datasets: datasets },
        options: {
          animation: false,
          scales: {
            y: { min: min, max: max, title: { display: true, text: unite } },
            x: { title: { display: true, text: 'Heure' } }
          }
        }
      });
    }

    const seuil = (label) => ({ label: label, data: [], borderColor: '#999', borderDash: [6, 4], pointRadius: 0, fill: false });
    const chartTemp = creerGraphique('chartTemp', [
      { label: 'Température (°C)', data: [], borderColor: '#e4572e', backgroundColor: '#e4572e22', fill: true, tension: 0.3 },
      seuil('Seuil max'), seuil('Seuil min')
    ], '°C', 0, 50);
    const chartHum = creerGraphique('chartHum', [
      { label: 'Humidité (%)', data: [], borderColor: '#1b7fd0', backgroundColor: '#1b7fd022', fill: true, tension: 0.3 }
    ], '%', 20, 90);

    async function refresh() {
      try {
        const res = await fetch('/api/get/');
        const json = await res.json();
        const rows = json.data.slice().reverse();   // du plus ancien au plus récent
        if (rows.length === 0) return;

        const labels = rows.map(r => new Date(r.date).toLocaleTimeString());

        if (chartTemp) {
          chartTemp.data.labels = labels;
          chartTemp.data.datasets[0].data = rows.map(r => r.temp);
          chartTemp.data.datasets[1].data = labels.map(() => SEUIL_MAX);
          chartTemp.data.datasets[2].data = labels.map(() => SEUIL_MIN);
          chartTemp.update();
        }
        if (chartHum) {
          chartHum.data.labels = labels;
          chartHum.data.datasets[0].data = rows.map(r => r.hum);
          chartHum.update();
        }

        // Tableau des incidents
        const lignes = analyser(rows);
        const nbIncidents = lignes.filter(l => l.compteur === 1).length;  // un incident = un passage du compteur à 1
        document.getElementById('nbInc').textContent = nbIncidents;
        document.getElementById('corps').innerHTML = lignes.slice(-MAX_LIGNES).map(l =>
          '<tr class="' + (l.incident ? 'alerte' : '') + '">' +
          '<td>' + new Date(l.date).toLocaleTimeString() + '</td>' +
          '<td>' + l.temp.toFixed(1) + '</td>' +
          '<td>' + l.incident + '</td><td>' + l.compteur + '</td>' +
          '<td>' + l.op1 + '</td><td>' + l.op2 + '</td><td>' + l.op3 + '</td></tr>'
        ).join('');

        const last = rows[rows.length - 1];
        document.getElementById('temp').textContent = last.temp.toFixed(1) + ' °C';
        document.getElementById('hum').textContent = last.hum.toFixed(0) + ' %';
        document.getElementById('status').textContent =
          'Dernière mesure : ' + new Date(last.date).toLocaleString();
      } catch (e) {
        document.getElementById('status').textContent = 'Erreur de connexion au serveur';
      }
    }

    refresh();
    setInterval(refresh, 5000);   // rafraîchit toutes les 5 secondes
  </script>
</body>
</html>
