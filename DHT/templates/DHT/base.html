<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Température et humidité{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 20px; color: #222; }
    h1 { text-align: center; }
    .btn { display: inline-block; border: 0; border-radius: 8px; padding: 12px 18px; font-size: 16px; font-weight: bold; background: #1b7fd0; color: #fff; text-decoration: none; cursor: pointer; }
    .btn:hover { background: #1565a8; }
    .btn:disabled { background: #8aa; cursor: wait; }
    .btn.secondary { background: #6b7280; }
    .topbar { max-width: 1000px; margin: 0 auto 10px auto; display: flex; justify-content: space-between; gap: 10px; }
    .box { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1); max-width: 1000px; margin: 0 auto 20px auto; }
    #status { text-align: center; margin-top: 12px; color: #666; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <script>
    // ---- Réglages communs ----
    const SEUIL_MAX = 25;          // incident si température > SEUIL_MAX
    const SEUIL_MIN = 15;          // ou si température < SEUIL_MIN
    const NIVEAUX = [1, 4, 7];     // compteur à atteindre pour Op1, Op2, Op3

    async function chargerMesures() {
      const res = await fetch('/api/get/');
      const json = await res.json();
      return json.data.slice().reverse();      // du plus ancien au plus récent
    }

    function analyser(rows) {
      let compteur = 0;
      return rows.map(r => {
        const incident = (r.temp > SEUIL_MAX || r.temp < SEUIL_MIN) ? 1 : 0;
        compteur = incident ? compteur + 1 : 0;
        return {
          date: r.date, temp: r.temp, incident: incident, compteur: compteur,
          op1: compteur >= NIVEAUX[0] ? 1 : 0,
          op2: compteur >= NIVEAUX[1] ? 1 : 0,
          op3: compteur >= NIVEAUX[2] ? 1 : 0
        };
      });
    }

    function formatDate(iso) {                  // AAAA-MM-JJ HH:MM:SS (heure locale)
      const d = new Date(iso), p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
             p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    function telechargerCSV(nom, entetes, lignes) {
      // séparateur ";" et virgule décimale : s'ouvre correctement dans Excel en français
      const cell = v => typeof v === 'number' ? String(v).replace('.', ',') : v;
      const texte = [entetes].concat(lignes).map(l => l.map(cell).join(';')).join('\r\n');
      const blob = new Blob(['\ufeff' + texte], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nom;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
